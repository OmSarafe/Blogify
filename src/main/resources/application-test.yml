server:
  port: 8082
  servlet:
    context-path: /test/api/${spring.application.name}

spring:
#  security:
#    user:
#      name: om
#      password: ${SECURITY_PASSWORD}
  datasource:
    url: jdbc:mysql://localhost:3306/bloghive_test
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  mail:
    port: '587'
    properties:
      mail:
        smtp:
          auth: 'true'
          starttls:
            enable: 'true'
            required: 'true'
    host: smtp.gmail.com
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
